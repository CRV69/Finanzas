name: Implementar en GitHub Pages

on:
  push:
    branches: [ principal ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar Contraseña Segura
        run: |
          # Reemplaza la línea entera de la contraseña por tu secreto de GitHub
          sed -i 's/const TARGET_HASH = ".*";/const TARGET_HASH = "${{ secrets.APP_PASSWORD_HASH }}";/g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
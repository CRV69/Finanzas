name: Implementar en GitHub Pages

on:
  push:
    branches: [ principal ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Password Hash
        run: |
          sed -i 's/__PASSWORD_HASH_PLACEHOLDER__/${{ secrets.APP_PASSWORD_HASH }}/g' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .